[package]
name = "premium-self-bot"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[dependencies]
teloxide = { version = "0.17", features = ["macros"] }
tokio = { version = "1.39", features = ["rt-multi-thread", "macros", "signal"] }
log = "0.4"
env_logger = "0.11"
regex = "1"
uuid = { version = "1", features = ["v4"] }
once_cell = "1"
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
